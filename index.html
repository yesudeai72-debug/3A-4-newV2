<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>분짜 요리 어휘 · 한국어 3A</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
    :root{--ink:#17352f;--green:#1b5b46;--orange:#d86f20;--line:#d9e8dc}*{box-sizing:border-box}body{margin:0;background:#f6faf7;color:var(--ink);font-family:'Noto Sans KR',sans-serif}.page{width:min(1180px,calc(100% - 36px));margin:auto;padding-bottom:48px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:#668378;font-size:.88rem;font-weight:700}.tag{background:var(--green);color:#fff;padding:7px 11px;border-radius:8px}.hero{padding:58px 0 35px;max-width:760px}.eyebrow{margin:0 0 11px;color:#cf671b;font-size:.75rem;font-weight:800;letter-spacing:.12em}.hero h1,.video-copy h2,.quiz-intro h2{font-family:'Gowun Batang',serif;letter-spacing:-.06em}.hero h1{font-size:clamp(2.25rem,5vw,4rem);line-height:1.27;margin:0}.hero>p:last-child{font-size:1.02rem;line-height:1.85;color:#55746a;margin:19px 0 0;word-break:keep-all}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:28px}.tabs button{cursor:pointer;padding:12px 16px;border:0;border-bottom:3px solid transparent;background:transparent;color:#6a857b;font:800 1rem 'Noto Sans KR'}.tabs button.active{border-color:var(--orange);color:var(--ink)}.panel{display:none}.panel.active{display:block}.video-panel{display:grid;grid-template-columns:.75fr 1.25fr;gap:28px;align-items:center;padding:26px;border-radius:20px;background:#e8f1eb;border:1px solid #d3e1d7;margin-bottom:13px}.video-copy h2{font-size:clamp(1.5rem,3vw,2.25rem);line-height:1.35;margin:0}.video-copy>p:last-child{color:#58766a;line-height:1.75;font-size:.91rem;word-break:keep-all}.video{width:100%;display:block;border-radius:12px;background:#102c24;box-shadow:0 8px 22px #173f3233}.word-rail{display:flex;gap:8px;overflow:auto;padding:4px 0 21px}.word-rail span{flex:none;border-radius:999px;background:#fff6ed;border:1px solid #f0d2b4;color:#9c4a18;padding:7px 11px;font-size:.82rem;font-weight:800}.word-rail b{font-size:.7rem;margin-right:5px;color:#d67229}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{overflow:hidden;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px #1d49300c}.card img{width:100%;aspect-ratio:1.65;object-fit:cover;display:block}.card-body{padding:18px 20px 20px}.number{color:#c8641f;font-size:.78rem;font-weight:800;letter-spacing:.08em}.card h3{display:inline;margin:0 0 0 8px;font-family:'Gowun Batang',serif;font-size:1.6rem}.card p{margin:12px 0 9px;font-weight:700;letter-spacing:-.03em;font-size:1.03rem}.card small{color:#718b81;font-size:.84rem}.quiz-intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:21px}.quiz-intro h2{margin:0;font-size:clamp(1.45rem,3vw,2rem)}.score{padding:11px 15px;background:#eef7ed;border-radius:11px;color:#4e7563;font-size:.86rem}.score strong{font-size:1.35rem;color:var(--green)}.quiz-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.question{display:grid;grid-template-columns:138px 1fr;gap:15px;align-items:center;padding:13px;border-radius:16px;background:#fff;border:1px solid var(--line)}.question.correct{background:#fbfffa;border-color:#81bb91}.question.wrong{background:#fffaf7;border-color:#e8ad90}.question img{width:138px;height:108px;object-fit:cover;border-radius:10px}.sentence{margin:7px 0 12px;font-family:'Gowun Batang',serif;font-size:1.04rem;font-weight:700;white-space:nowrap}.options{display:flex;flex-wrap:wrap;gap:6px}.options button{border:1px solid #d6e5da;background:#fff;color:#55756a;border-radius:999px;padding:6px 9px;cursor:pointer;font:700 .78rem 'Noto Sans KR'}.options button:hover,.options button.selected{border-color:var(--green);color:#fff;background:var(--green)}.answer{color:#b05425;font-size:.8rem;margin:10px 0 0}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.actions button{display:flex;gap:7px;align-items:center;border-radius:10px;min-height:44px;padding:0 15px;cursor:pointer;font-weight:800}.reset{background:#fff;border:1px solid #cadfd0;color:#466a5b}.check{border:1px solid var(--orange);background:var(--orange);color:#fff}.check:disabled{opacity:.5;cursor:not-allowed}footer{text-align:center;margin-top:55px;color:#7d958b;font-size:.8rem}@media(max-width:720px){.page{width:min(100% - 26px,1180px)}.hero{padding:36px 0 27px}.video-panel,.grid,.quiz-grid{grid-template-columns:1fr}.video-panel{gap:18px;padding:18px}.video-copy h2 br{display:none}.question{grid-template-columns:112px 1fr}.question img{width:112px;height:92px}.tabs{margin-bottom:20px}.hero>p:last-child{font-size:.95rem}}@media(max-width:390px){.question{grid-template-columns:1fr}.question img{width:100%;height:150px}.sentence{white-space:normal}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><span class="tag">한국어 3A</span><span>분짜 요리 어휘</span></header>
    <section class="hero"><p class="eyebrow">VIETNAMESE COOKING VOCABULARY</p><h1>분짜를 만들며<br>단어를 공부해요.</h1><p>사진을 보고 <strong>볶다 · 찌다 · 튀기다 · 삶다 · 부치다 · 굽다 · 끓이다</strong>를 연습해 보세요.</p></section>
    <nav class="tabs"><button class="active" data-tab="learn">1. 영상으로 떠올리기</button><button data-tab="quiz">2. 동사 복습</button></nav>
    <section id="learn" class="panel active"><div class="video-panel"><div class="video-copy"><p class="eyebrow">WATCH FIRST</p><h2>영상 속 동사를<br>소리 내어 따라 해 보세요.</h2><p>각 장면은 약 1.7초씩 나옵니다. 영상을 본 뒤 아래 카드로 문장을 다시 확인해 보세요.</p></div><video class="video" src="assets/bun-cha-vocabulary-intro.mp4" controls autoplay muted playsinline></video></div><div id="word-rail" class="word-rail"></div><div id="cards" class="grid"></div></section>
    <section id="quiz" class="panel"><div class="quiz-intro"><div><p class="eyebrow">RECALL PRACTICE</p><h2>사진에 맞는 동사를 고르세요.</h2></div><div id="score" class="score" hidden><strong>0</strong> / 7 정답</div></div><div id="questions" class="quiz-grid"></div><div class="actions"><button class="reset" id="reset">다시 하기</button><button class="check" id="check" disabled>정답 확인</button></div></section>
    <footer>맛있는 분짜와 함께 배우는 한국어 요리 동작</footer>
  </main>
  <script>
    const steps=[
      ['굽다','돼지고기 완자를 숯불에 굽다','숯불에 완자를 익혀요.','01-grill.png'],['삶다','쌀국수 면을 물에 삶다','끓는 물에 면을 익혀요.','02-boil.png'],['튀기다','춘권을 기름에 튀기다','뜨거운 기름에 바삭하게 익혀요.','03-deep-fry.png'],['찌다','새우와 레몬그라스를 찌다','김으로 새우를 익혀요.','04-steam.png'],['볶다','숙주 나물을 볶다','팬에서 재료를 저으며 익혀요.','05-stir-fry.png'],['부치다','계란을 부치다','팬에 얇게 펴서 익혀요.','06-pan-fry.png'],['끓이다','느억맘 소스를 끓이다','냄비에서 소스가 보글보글 끓어요.','07-simmer.png']
    ];
    const cards=document.querySelector('#cards'),rail=document.querySelector('#word-rail'),questions=document.querySelector('#questions'),check=document.querySelector('#check'),reset=document.querySelector('#reset'),score=document.querySelector('#score');
    const positions=[3,1,5,0,4,2,6]; let answers=[];
    steps.forEach(([verb,phrase,cue,img],i)=>{rail.insertAdjacentHTML('beforeend',`<span><b>${String(i+1).padStart(2,'0')}</b>${verb}</span>`);cards.insertAdjacentHTML('beforeend',`<article class="card"><img src="assets/${img}" alt="${phrase}"><div class="card-body"><span class="number">${String(i+1).padStart(2,'0')}</span><h3>${verb}</h3><p>${phrase}</p><small>${cue}</small></div></article>`)});
    function drawQuiz(){answers=[];score.hidden=true;check.disabled=true;questions.innerHTML='';steps.forEach(([verb,phrase,,img],i)=>{const options=steps.filter(s=>s[0]!==verb).map(s=>s[0]);options.splice(positions[i],0,verb);const blank=phrase.replace(verb,'　　　');questions.insertAdjacentHTML('beforeend',`<article class="question" data-index="${i}"><img src="assets/${img}" alt="요리 동작 사진"><div><span class="number">${String(i+1).padStart(2,'0')}</span><p class="sentence">${blank}</p><div class="options">${options.map(o=>`<button data-value="${o}">${o}</button>`).join('')}</div><p class="answer" hidden>정답: <b>${verb}</b></p></div></article>`)});document.querySelectorAll('.options button').forEach(button=>button.onclick=()=>{const article=button.closest('.question'),i=+article.dataset.index;if(article.classList.contains('correct')||article.classList.contains('wrong'))return;article.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');answers[i]=button.dataset.value;check.disabled=answers.filter(Boolean).length!==7})}
    check.onclick=()=>{let right=0;steps.forEach(([verb],i)=>{const article=document.querySelector(`[data-index="${i}"]`),correct=answers[i]===verb;article.classList.add(correct?'correct':'wrong');article.querySelectorAll('button').forEach(b=>b.disabled=true);if(!correct)article.querySelector('.answer').hidden=false;if(correct)right++});score.innerHTML=`<strong>${right}</strong> / 7 정답`;score.hidden=false};reset.onclick=drawQuiz;drawQuiz();
    document.querySelectorAll('.tabs button').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(el=>el.classList.remove('active'));button.classList.add('active');document.querySelector('#'+button.dataset.tab).classList.add('active')});
  </script>
</body>
</html>
